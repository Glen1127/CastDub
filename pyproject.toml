[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "drama-localisation-studio"
version = "0.1.0"
description = "Local-first, rights-gated multi-character drama localisation pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Drama Localisation Studio contributors" }]
dependencies = []
keywords = ["dubbing", "localisation", "voice-cloning", "jianying", "douyin"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Multimedia :: Video",
]

[project.scripts]
castdub = "castdub.cli:main"

[project.urls]
Homepage = "https://github.com/Glen1127/drama-localisation-studio"
Repository = "https://github.com/Glen1127/drama-localisation-studio"
Issues = "https://github.com/Glen1127/drama-localisation-studio/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/castdub"]

[tool.hatch.build]
exclude = [
  "schemas/reverse-blueprint.schema.json",
  "src/castdub/reverse/**",
  "tests/test_reverse.py",
]
